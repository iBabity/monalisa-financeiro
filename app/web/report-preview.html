<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RELATÓRIO • MONALISA FINANCEIRO</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f2ea;color:#073f43;font:16px system-ui,sans-serif;text-align:center}
main{padding:32px;max-width:400px}h1{font-size:22px}p{line-height:1.6;color:#566b6b}
.spinner{margin:0 auto 24px;width:36px;height:36px;border:4px solid #dce5e1;border-top-color:#073f43;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
<main><div class="spinner" role="status" aria-label="GERANDO RELATÓRIO"></div><h1>PREPARANDO SEU RELATÓRIO</h1><p>AGUARDE. O PDF SERÁ EXIBIDO AQUI ASSIM QUE ESTIVER PRONTO.</p></main>
</html>
